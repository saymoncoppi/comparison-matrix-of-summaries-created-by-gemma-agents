<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- shadcn/ui não tem bundle de CDN: usa-se o Tailwind (CDN) com os tokens de tema
     e as receitas de classes dos componentes (card, badge, button...) do shadcn. -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        border: 'hsl(var(--border) / <alpha-value>)',
        input: 'hsl(var(--input) / <alpha-value>)',
        ring: 'hsl(var(--ring) / <alpha-value>)',
        background: 'hsl(var(--background) / <alpha-value>)',
        foreground: 'hsl(var(--foreground) / <alpha-value>)',
        primary: { DEFAULT: 'hsl(var(--primary) / <alpha-value>)', foreground: 'hsl(var(--primary-foreground) / <alpha-value>)' },
        secondary: { DEFAULT: 'hsl(var(--secondary) / <alpha-value>)', foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)' },
        destructive: { DEFAULT: 'hsl(var(--destructive) / <alpha-value>)', foreground: 'hsl(var(--destructive-foreground) / <alpha-value>)' },
        muted: { DEFAULT: 'hsl(var(--muted) / <alpha-value>)', foreground: 'hsl(var(--muted-foreground) / <alpha-value>)' },
        accent: { DEFAULT: 'hsl(var(--accent) / <alpha-value>)', foreground: 'hsl(var(--accent-foreground) / <alpha-value>)' },
        card: { DEFAULT: 'hsl(var(--card) / <alpha-value>)', foreground: 'hsl(var(--card-foreground) / <alpha-value>)' },
      },
      borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
    } },
  };
</script>
<script>
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
</script>
<style>
  /* Tokens do shadcn/ui (tema zinc) */
  :root {
    --background: 0 0% 100%; --foreground: 240 10% 3.9%;
    --card: 0 0% 100%; --card-foreground: 240 10% 3.9%;
    --primary: 240 5.9% 10%; --primary-foreground: 0 0% 98%;
    --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
    --destructive: 0 84.2% 60.2%; --destructive-foreground: 0 0% 98%;
    --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 240 10% 3.9%;
    --radius: 0.5rem;
  }
  .dark {
    --background: 240 10% 3.9%; --foreground: 0 0% 98%;
    --card: 240 10% 3.9%; --card-foreground: 0 0% 98%;
    --primary: 0 0% 98%; --primary-foreground: 240 5.9% 10%;
    --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%;
    --destructive: 0 62.8% 30.6%; --destructive-foreground: 0 0% 98%;
    --border: 240 3.7% 15.9%; --input: 240 3.7% 15.9%; --ring: 240 4.9% 83.9%;
  }
  body { background: hsl(var(--background)); color: hsl(var(--foreground));
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) + 4px);
          background: hsl(var(--card)); color: hsl(var(--card-foreground));
          box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
  .badge { display: inline-flex; align-items: center; border-radius: 9999px; padding: 2px 10px;
           font-size: 12px; font-weight: 600; background: hsl(var(--secondary));
           color: hsl(var(--secondary-foreground)); }
  .badge-destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
         height: 40px; padding: 0 16px; border-radius: var(--radius); font-size: 14px; font-weight: 500;
         background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); cursor: pointer;
         border: 1px solid transparent; transition: opacity .15s; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .btn-outline { background: transparent; color: hsl(var(--foreground)); border-color: hsl(var(--input)); }
  .btn-outline:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); opacity: 1; }
  .btn-sm { height: 36px; padding: 0 12px; }
  .alert { border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 12px 16px;
           font-size: 14px; background: hsl(var(--muted)); }
  .stat-label { font-size: 12px; color: hsl(var(--muted-foreground)); }
  .stat-value { font-size: 15px; font-weight: 600; margin-top: 2px; }
  /* markdown renderizado dos resumos */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { font-weight: 600; margin: 1em 0 .4em; line-height: 1.3; }
  .md h1 { font-size: 1.25em; } .md h2 { font-size: 1.15em; } .md h3, .md h4 { font-size: 1.05em; }
  .md p { margin: .6em 0; } .md ul { list-style: disc; padding-left: 1.4em; margin: .6em 0; }
  .md ol { list-style: decimal; padding-left: 1.4em; margin: .6em 0; }
  .md code { background: hsl(var(--muted)); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .md hr { border-color: hsl(var(--border)); margin: 1em 0; }
  .md a { text-decoration: underline; }
  .md table { width: 100%; border-collapse: collapse; margin: .8em 0; font-size: .95em; }
  .md th, .md td { border: 1px solid hsl(var(--border)); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: hsl(var(--muted)); font-weight: 600; }
  .md pre { background: hsl(var(--muted)); padding: 12px; border-radius: var(--radius); overflow-x: auto; margin: .8em 0; font-size: .875em; }
  .md pre code { background: transparent; padding: 0; }
  .md li { margin: .2em 0; }
  .md img { max-width: 100%; height: auto; margin: .6em 0 1.2em; border: 1px solid hsl(var(--border));
            border-radius: var(--radius); }
</style>
