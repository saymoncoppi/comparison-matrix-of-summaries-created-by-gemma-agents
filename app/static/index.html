<!doctype html>
<html lang="pt-BR">
<head>
<title>Resumos locais</title>
<!--HEAD-->
<style>
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9999px;
          font-size: 13px; font-weight: 500; border: 1px solid hsl(var(--input)); cursor: pointer;
          background: transparent; color: hsl(var(--foreground)); transition: background .15s; }
  .chip:hover { background: hsl(var(--accent)); }
  .chip[aria-pressed="true"] { background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
          border-color: hsl(var(--primary)); }
  .input { height: 32px; border-radius: var(--radius); border: 1px solid hsl(var(--input)); background: transparent;
           padding: 0 10px; font-size: 13px; width: 11rem; color: hsl(var(--foreground)); }
  .input:focus { outline: 2px solid hsl(var(--ring)); outline-offset: 1px; }
  .drop[data-over="true"] { border-color: hsl(var(--ring)); background: hsl(var(--accent)); }
  .stream { white-space: pre-wrap; max-height: 16rem; overflow-y: auto; }

  /* barra de progresso (rodapé de cada card) */
  .bar { height: 6px; border-radius: 9999px; background: hsl(var(--secondary)); overflow: hidden; transition: opacity .4s; }
  .bar > div { height: 100%; width: 0; border-radius: 9999px; background: hsl(var(--primary)); transition: width .25s ease; }
  .bar.indet > div { width: 40%; animation: slide 1.2s ease-in-out infinite; }
  .bar.fade { opacity: 0; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar.indet > div { animation: none; width: 100%; opacity: .5; } }

  /* menu de 3 pontinhos */
  .menu-item { display: flex; width: 100%; align-items: center; border-radius: calc(var(--radius) - 2px);
               padding: 8px 10px; font-size: 14px; text-align: left; cursor: pointer; background: transparent;
               color: hsl(var(--foreground)); border: 0; }
  .menu-item:hover, .menu-item:focus-visible { background: hsl(var(--accent)); outline: none; }

  /* modal (dialog nativo) */
  dialog.modal { padding: 0; width: min(1100px, 95vw); height: min(85vh, 900px); max-width: none; max-height: none;
                 border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) + 4px);
                 background: hsl(var(--background)); color: hsl(var(--foreground));
                 box-shadow: 0 20px 50px rgb(0 0 0 / .3); }
  dialog.modal[open] { display: flex; flex-direction: column; }
  dialog.modal::backdrop { background: rgb(0 0 0 / .55); }
  dialog.modal iframe { flex: 1; width: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
<div class="mx-auto flex h-screen max-w-3xl flex-col px-4">
  <header class="flex items-center justify-between border-b border-border py-4">
    <div>
      <h1 class="text-lg font-semibold tracking-tight">Resumos locais</h1>
      <p class="text-sm text-muted-foreground">Envie um PDF, TXT ou MD e receba um relatório HTML.</p>
    </div>
    <div class="flex items-center gap-2">
      <button id="new-btn" type="button" class="btn btn-outline btn-sm">Nova análise</button>
      <div class="relative">
        <button id="menu-btn" type="button" class="btn btn-outline btn-sm" style="width:36px;padding:0"
                aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Mais opções">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <circle cx="8" cy="3" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>
        </button>
        <div id="menu" role="menu" class="card absolute right-0 z-20 mt-2 hidden w-44 p-1" style="box-shadow:0 8px 24px rgb(0 0 0 / .15)">
          <button type="button" role="menuitem" class="menu-item" data-open="/history" data-title="Histórico">Histórico</button>
          <button type="button" role="menuitem" class="menu-item" data-open="/help" data-title="Ajuda">Ajuda</button>
        </div>
      </div>
    </div>
  </header>

  <main id="chat" class="flex-1 space-y-4 overflow-y-auto py-4" aria-live="polite"></main>

  <footer class="pb-4 pt-2">
    <form id="form" class="card space-y-3 p-4">
      <div>
        <div class="mb-2 text-xs font-medium text-muted-foreground">Modelos</div>
        <div class="flex flex-wrap items-center gap-2">
          <span id="chips" class="flex flex-wrap gap-2"></span>
          <input id="add-model" class="input" placeholder="outro modelo + Enter" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div id="drop" class="drop flex items-center justify-between gap-3 rounded-lg border border-dashed border-input p-3">
        <div id="file-info" class="min-w-0 truncate text-sm text-muted-foreground"></div>
        <div class="flex shrink-0 gap-2">
          <button id="pick" type="button" class="btn btn-outline btn-sm">Escolher arquivo</button>
          <button id="send" type="submit" class="btn btn-sm" disabled>Gerar relatório</button>
        </div>
        <input id="file" type="file" accept=".pdf,.txt,.md,.markdown" class="hidden">
      </div>
    </form>
  </footer>
</div>

<dialog id="modal" class="modal" aria-labelledby="modal-title">
  <div class="flex items-center justify-between gap-2 border-b border-border px-4 py-3">
    <div class="flex min-w-0 items-center gap-2">
      <button id="modal-back" type="button" class="btn btn-outline btn-sm hidden">← Voltar</button>
      <h2 id="modal-title" class="truncate font-semibold"></h2>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <a id="modal-ext" class="btn btn-outline btn-sm" target="_blank" rel="noopener">Abrir em nova aba</a>
      <button id="modal-close" type="button" class="btn btn-outline btn-sm" style="width:36px;padding:0" aria-label="Fechar">✕</button>
    </div>
  </div>
  <iframe id="modal-frame" title="Conteúdo"></iframe>
</dialog>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const OK_EXT = ['pdf', 'txt', 'md', 'markdown'];
const DROP_HINT = 'Arraste um arquivo (pdf, txt, md)';
let file = null, busy = false;
const selected = new Set();

function scroll() { const c = $('#chat'); c.scrollTop = c.scrollHeight; }
function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(1) + ' KB'; }
function refreshButtons() { $('#send').disabled = busy || !file || selected.size === 0; $('#new-btn').disabled = busy; }

// ---- modal (histórico, ajuda e relatório) -----------------------------------
const modal = $('#modal'), frame = $('#modal-frame');
let modalStart = '';
function embedUrl(path) { return path + (path.includes('?') ? '&' : '?') + 'embed=1'; }
function openModal(path, title) {
  modalStart = path; $('#modal-title').textContent = title; $('#modal-back').classList.add('hidden');
  $('#modal-ext').href = path; frame.src = embedUrl(path);
  if (!modal.open) modal.showModal();
}
// Dentro do iframe o usuário navega (histórico -> relatório): acompanha título e botão "Voltar".
frame.addEventListener('load', () => {
  let p; try { p = frame.contentWindow.location.pathname; } catch { return; }
  if (!p || p === 'blank') return;
  const m = p.match(/^\/reports\/(\d+)$/);
  $('#modal-title').textContent = m ? 'Relatório #' + m[1] : p === '/history' ? 'Histórico' : p === '/help' ? 'Ajuda' : '';
  $('#modal-ext').href = p;
  $('#modal-back').classList.toggle('hidden', p === modalStart.split('?')[0]);
});
$('#modal-back').onclick = () => { try { frame.contentWindow.history.back(); } catch { frame.src = embedUrl(modalStart); } };
$('#modal-close').onclick = () => modal.close();
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });   // clique no fundo
modal.addEventListener('close', () => { frame.src = 'about:blank'; });

// ---- menu de 3 pontinhos ------------------------------------------------------
const menu = $('#menu'), menuBtn = $('#menu-btn');
function setMenu(open) { menu.classList.toggle('hidden', !open); menuBtn.setAttribute('aria-expanded', open); }
menuBtn.onclick = e => { e.stopPropagation(); setMenu(menu.classList.contains('hidden')); if (!menu.classList.contains('hidden')) menu.querySelector('[role=menuitem]').focus(); };
menu.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (!b) return; setMenu(false); openModal(b.dataset.open, b.dataset.title); });
document.addEventListener('click', e => { if (!menu.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.classList.contains('hidden')) { setMenu(false); menuBtn.focus(); } });

// ---- modelos ------------------------------------------------------------------
function addChip(name, on) {
  if ([...$('#chips').children].some(c => c.dataset.model === name)) { if (on) toggle(name, true); return; }
  const b = el('button', 'chip', name); b.type = 'button'; b.dataset.model = name;
  b.setAttribute('aria-pressed', 'false'); b.onclick = () => toggle(name);
  $('#chips').appendChild(b); if (on) toggle(name, true);
}
function toggle(name, force) {
  const b = [...$('#chips').children].find(c => c.dataset.model === name);
  const on = force ?? !selected.has(name);
  on ? selected.add(name) : selected.delete(name);
  b.setAttribute('aria-pressed', on); refreshButtons();
}
async function loadModels() {
  try {
    const { models } = await (await fetch('/api/models')).json();
    models.forEach(m => addChip(m, false));
    const pref = models.find(m => m === 'gemma3:4b') || models[0];
    if (pref) toggle(pref, true);
  } catch { /* sem lista: o usuário digita o nome */ }
}
$('#add-model').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = e.target.value.trim();
  if (/^[A-Za-z0-9][A-Za-z0-9._:\/-]{0,100}$/.test(v)) { addChip(v, true); e.target.value = ''; }
});

// ---- arquivo ------------------------------------------------------------------
function setFile(f) {
  if (!f) return;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (!OK_EXT.includes(ext)) { systemMsg(`Tipo não compatível: ".${ext}". Use pdf, txt ou md.`, true); return; }
  if (f.size > 20 * 1048576) { systemMsg('Arquivo maior que 20 MB.', true); return; }
  file = f; $('#file-info').textContent = `${f.name} · ${fmtSize(f.size)}`;
  $('#file-info').classList.remove('text-muted-foreground'); refreshButtons();
}
$('#pick').onclick = () => $('#file').click();
$('#file').onchange = e => setFile(e.target.files[0]);
const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.dataset.over = 'true'; }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.dataset.over = 'false'; }));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

// ---- conversa -----------------------------------------------------------------
function systemMsg(text, err) {
  const m = el('div', 'card p-3 text-sm ' + (err ? 'border-destructive' : 'text-muted-foreground'), text);
  $('#chat').appendChild(m); scroll(); return m;
}
function userMsg() {
  const wrap = el('div', 'flex justify-end');
  const b = el('div', 'max-w-[85%] rounded-lg bg-primary p-3 text-sm text-primary-foreground');
  b.appendChild(el('div', 'font-medium', file.name));
  b.appendChild(el('div', 'text-xs opacity-80', `${fmtSize(file.size)} · ${[...selected].join(', ')}`));
  wrap.appendChild(b); $('#chat').appendChild(wrap); scroll();
}

// Nova análise: volta ao estado inicial (mantém os modelos escolhidos).
function newAnalysis() {
  if (busy) return;
  $('#chat').textContent = '';
  systemMsg('Escolha um ou mais modelos e anexe um arquivo. Com mais de um modelo, o relatório vira uma comparação. ' +
            'Os modelos rodam em sequência, um por vez.');
  file = null; $('#file').value = '';
  $('#file-info').textContent = DROP_HINT; $('#file-info').classList.add('text-muted-foreground');
  refreshButtons();
}
$('#new-btn').onclick = newAnalysis;

// ---- envio e stream de eventos --------------------------------------------------
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy || !file || !selected.size) return;
  const models = [...selected];
  busy = true; refreshButtons(); userMsg();
  const box = el('div', 'space-y-3'); $('#chat').appendChild(box);
  const status = el('div', 'card p-3 text-sm text-muted-foreground', 'Enviando arquivo…'); box.appendChild(status);
  const panels = {};
  let expected = 150;   // tokens esperados no resumo (estimativa, só para a barra)
  const url = '/api/summarize?models=' + encodeURIComponent(models.join(',')) + '&filename=' + encodeURIComponent(file.name);

  // Card por modelo; a barra de progresso fica no rodapé até a análise terminar.
  function makePanel(model) {
    const card = el('div', 'card space-y-2 p-4');
    const head = el('div', 'flex items-center justify-between gap-2');
    head.appendChild(el('div', 'font-semibold', model));
    const badge = el('span', 'badge', 'na fila'); head.appendChild(badge);
    const text = el('div', 'stream hidden text-sm'); const stats = el('div', 'flex flex-wrap gap-2');
    const bar = el('div', 'bar'); bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-label', 'Progresso de ' + model);
    bar.setAttribute('aria-valuemin', 0); bar.setAttribute('aria-valuemax', 100);
    const fill = el('div'); bar.appendChild(fill);
    card.append(head, text, stats, bar); box.appendChild(card);
    return panels[model] = { card, badge, bar, fill, text, stats, tokens: 0, pct: 0, finished: false };
  }
  const panel = m => panels[m] || makePanel(m);
  function setIndeterminate(p) { p.bar.classList.add('indet'); p.bar.removeAttribute('aria-valuenow'); }
  function setPct(p, v) {   // nunca recua
    p.bar.classList.remove('indet'); p.pct = Math.max(p.pct, Math.min(100, v));
    p.fill.style.width = p.pct + '%'; p.bar.setAttribute('aria-valuenow', Math.round(p.pct));
  }
  function finishBar(p, ok) {
    p.finished = true; p.bar.classList.remove('indet');
    if (ok) setPct(p, 100);
    setTimeout(() => p.bar.classList.add('fade'), 500);
    setTimeout(() => p.bar.remove(), 1000);
  }
  const stat = (p, label, v) => p.stats.appendChild(el('span', 'badge', `${label} ${v}`.trim()));

  function handle(ev) {
    if (ev.type === 'info') {
      expected = Math.min(600, Math.max(80, Math.round(ev.est_tokens * 0.35)));
      status.textContent = `Arquivo lido: ${ev.ftype} · ${ev.chars.toLocaleString('pt-BR')} caracteres · contexto ${ev.ctx}`;
      ev.warnings.forEach(w => box.appendChild(el('div', 'alert', w)));
      models.forEach(panel);
    } else if (ev.type === 'queue') {
      status.textContent = 'Outro job está rodando; aguardando a vez…';
    } else if (ev.type === 'model_start') {
      const p = panel(ev.model); p.badge.textContent = `${ev.index}/${ev.total} · carregando e lendo o texto`; setIndeterminate(p);
    } else if (ev.type === 'pull') {
      const p = panel(ev.model);
      if (ev.percent != null) { setPct(p, ev.percent); p.badge.textContent = `baixando ${ev.percent}%`; }
      else { p.badge.textContent = ev.status || 'baixando'; setIndeterminate(p); }
    } else if (ev.type === 'token') {
      const p = panel(ev.model); p.tokens++;
      if (p.tokens === 1) { p.bar.classList.remove('indet'); p.pct = 0; p.fill.style.width = '0%'; p.text.classList.remove('hidden'); }
      p.badge.textContent = `gerando · ${p.tokens} tokens`;
      setPct(p, Math.min(95, 100 * p.tokens / expected));   // estimativa; só chega a 100% ao concluir
      p.text.textContent += ev.text; p.text.scrollTop = p.text.scrollHeight;
    } else if (ev.type === 'model_done') {
      const p = panel(ev.model); p.badge.textContent = 'concluído'; finishBar(p, true);
      stat(p, 'carga', ev.load_s.toFixed(1) + 's'); stat(p, 'leitura', ev.read_s.toFixed(1) + 's');
      stat(p, 'geração', ev.gen_s.toFixed(1) + 's'); stat(p, '', ev.tok_s.toFixed(1) + ' tok/s');
      if (ev.truncated) stat(p, '', 'resumo cortado no limite de tokens');
    } else if (ev.type === 'model_error') {
      const p = panel(ev.model); p.badge.textContent = 'erro'; p.badge.classList.add('badge-destructive'); finishBar(p, false);
      p.stats.appendChild(el('div', 'text-sm text-destructive', ev.message));
    } else if (ev.type === 'done') {
      status.textContent = 'Relatório pronto.';
      const row = el('div', 'flex gap-2');
      const open = el('button', 'btn', 'Abrir relatório'); open.type = 'button';
      open.onclick = () => openModal(ev.report, 'Relatório #' + ev.run_id);
      const again = el('button', 'btn btn-outline', 'Nova análise'); again.type = 'button'; again.onclick = newAnalysis;
      row.append(open, again); box.appendChild(row);
    }
    scroll();
  }

  try {
    const res = await fetch(url, { method: 'POST', headers: { 'X-Upload': '1' }, body: file });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ message: res.statusText }));
      status.textContent = err.message; status.classList.add('border-destructive');
    } else {
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) handle(JSON.parse(line)); }
      }
    }
  } catch (err) {
    status.textContent = 'Falha na conexão com o servidor.'; status.classList.add('border-destructive');
  }
  // Conexão encerrada antes de concluir: não deixa barra "rodando" para sempre.
  Object.values(panels).filter(p => !p.finished).forEach(p => { p.badge.textContent = 'interrompido'; finishBar(p, false); });
  busy = false; refreshButtons();
});

newAnalysis();
loadModels();
</script>
</body>
</html>
