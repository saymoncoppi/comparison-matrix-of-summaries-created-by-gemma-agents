# Máximo de modelos na memória do Ollama E de modelos que o chat deixa marcar por execução. É o único lugar
# onde o padrão é definido; para mudar: OLLAMA_MAX_LOADED_MODELS=1 docker compose up -d (ou no arquivo .env).
x-max-models: &max_models ${OLLAMA_MAX_LOADED_MODELS:-2}

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    environment:
      # No máximo 2 modelos na memória (cada um fica 10 min): uma comparação entre dois modelos pode ser repetida
      # sem recarregar nenhum. Com 3 ou mais carregados a RAM acaba, o cache de disco encolhe e a leitura do
      # modelo seguinte fica ~1,6x mais lenta (medido: 26 contra 42 tok/s no gemma4:e4b), por isso o teto é 2.
      OLLAMA_MAX_LOADED_MODELS: *max_models
    # Para usar GPU NVIDIA (requer NVIDIA Container Toolkit), descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Baixa os modelos usados pelo chat (o que já existe termina na hora) e encerra. Numa instalação nova são
  # ~10 GB, então demora; o chat sobe sem esperar e lista cada modelo conforme ele fica pronto (recarregue a
  # página). Para baixar outros ou menos: MODELS="gemma3:1b gemma3:4b" docker compose up -d
  # (ou defina MODELS num arquivo .env). Acompanhe com: docker compose logs -f pull-model
  pull-model:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${MODELS:-gemma3:270m gemma3:1b gemma3:4b gemma4:e4b}
    # $$ é o escape do Compose: o shell do container é quem expande $MODELS. Para na primeira falha.
    entrypoint: ["sh", "-c", "for m in $$MODELS; do echo \"== $$m\"; ollama pull \"$$m\" || exit 1; done"]
    restart: "no"

  # Chat para enviar o arquivo e gerar o relatório HTML: http://localhost:8000
  #   docker compose up -d --build chat
  chat:
    build: ./app
    # init: o PID 1 do container passa a ser um mini init que repassa o sinal de parada ao Python. Sem ele, o
    # Python (PID 1) ignora o SIGTERM e o `docker compose stop` espera 10 s e o mata à força (código 137).
    init: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OUT_DIR: /outputs
      MAX_MODELS: *max_models   # limite de modelos marcados na tela (mesmo valor do Ollama)
    user: "1000:1000"   # mesmo dono dos arquivos do host (./outputs)
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./outputs:/outputs
      - ./README.md:/app/README.md:ro   # texto da página /help
      - ./assets:/app/assets:ro         # imagens que o README mostra na /help
    restart: unless-stopped

volumes:
  ollama:
